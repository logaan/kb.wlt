[package]
name = "kb-resetter"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[workspace]

[features]
default = []
firmware = ["dep:cortex-m", "dep:cortex-m-rt", "dep:embassy-executor", "dep:embassy-futures", "dep:embassy-nrf", "dep:embassy-sync", "dep:embassy-time", "dep:embassy-usb", "dep:panic-halt"]

[target.'cfg(target_arch = "arm")'.dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"], optional = true }
cortex-m-rt = { version = "0.7.5", optional = true }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"], optional = true }
embassy-futures = { version = "0.1.2", optional = true }
embassy-nrf = { version = "0.11.0", features = ["nrf52840", "time-driver-rtc1"], optional = true }
embassy-sync = { version = "0.8.0", optional = true }
embassy-time = { version = "0.5.1", optional = true }
embassy-usb = { version = "0.6.0", optional = true }
panic-halt = { version = "1.0.0", optional = true }

[[bin]]
name = "kb-resetter"
path = "src/main.rs"
required-features = ["firmware"]
test = false
bench = false

[profile.release]
codegen-units = 1
lto = true
opt-level = "s"
panic = "abort"
