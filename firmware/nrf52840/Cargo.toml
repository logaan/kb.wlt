[package]
name = "kb-nrf52840"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[workspace]

[features]
default = ["usb"]
usb = []
ble = ["dep:nrf-sdc", "dep:nrf-mpsl", "dep:trouble-host", "dep:static_cell", "dep:kb-bond-storage"]
paintbrush-left = []
composed = []
keyboard-composed = ["toucan"]
settings-reset = []
split = ["ble", "nrf-sdc/central", "trouble-host/central", "trouble-host/scan"]
split-pair = ["split"]
satellite-left = ["split"]
satellite-right = ["split"]
prospector-display = ["dep:kb-display"]
toucan = ["split"]
toucan-right = ["toucan"]
toucan-dongle = ["toucan"]
niceview-display = ["nice-view"]
nice-view = ["dep:kb-display"]
display = ["dep:kb-display"]

[dependencies]
critical-section = { version = "1.2.0", features = ["restore-state-bool"] }
cortex-m = "0.7.7"
cortex-m-rt = { version = "0.7.5", features = ["set-vtor"] }
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-nrf = { version = "0.11.0", features = ["nrf52840", "time-driver-rtc1", "unstable-pac", "nfc-pins-as-gpio"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb = "0.6.0"
embedded-storage = "0.3.2"
embedded-alloc = { version = "0.7.0", default-features = false, features = ["llff"] }
kb-component-runtime = { path = "../../crates/component-runtime" }
kb-display = { path = "../../crates/display", optional = true }
kb-core = { path = "../../crates/keyboard-core" }
panic-halt = "1.0.0"

nrf-sdc = { version = "0.4.0", optional = true, default-features = false, features = ["nrf52840", "peripheral"] }
nrf-mpsl = { version = "0.4.0", optional = true, features = ["nrf52840", "critical-section-impl"] }
trouble-host = { version = "0.8.0", optional = true, default-features = false, features = ["derive", "gatt", "peripheral", "default-packet-pool", "default-packet-pool-mtu-128", "default-packet-pool-size-8", "security", "serde"] }
static_cell = { version = "2.1.1", optional = true }
kb-bond-storage = { path = "../../crates/bond-storage", optional = true }

[[bin]]
name = "xiao-led"
required-features = ["usb"]

[[bin]]
name = "paintbrush-usb"
required-features = ["usb"]

[[bin]]
name = "paintbrush-ble"
required-features = ["ble"]

[[bin]]
name = "paintbrush-satellite"
required-features = ["split"]

[[bin]]
name = "paintbrush-central"
required-features = ["split"]

[[bin]]
name = "prospector-dongle"
required-features = ["split"]

[[bin]]
name = "settings-reset"
required-features = ["settings-reset"]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
debug = 2
panic = "abort"

[[bin]]
name = "toucan-ble"
required-features = ["toucan"]

[[bin]]
name = "toucan-satellite"
required-features = ["toucan"]

[[bin]]
name = "toucan-dongle"
required-features = ["toucan-dongle"]
