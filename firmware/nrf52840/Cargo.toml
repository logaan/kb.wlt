[package]
name = "kb-nrf52840"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[workspace]

[features]
default = ["usb"]
usb = []
ble = ["dep:nrf-sdc", "dep:nrf-mpsl", "dep:trouble-host", "dep:static_cell", "dep:postcard"]
paintbrush-left = []
composed = []
display = ["dep:kb-display"]

[dependencies]
critical-section = { version = "1.2.0", features = ["restore-state-bool"] }
cortex-m = "0.7.7"
cortex-m-rt = "0.7.5"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-nrf = { version = "0.11.0", features = ["nrf52840", "time-driver-rtc1", "unstable-pac", "nfc-pins-as-gpio"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb = "0.6.0"
embedded-alloc = { version = "0.7.0", default-features = false, features = ["llff"] }
kb-component-runtime = { path = "../../crates/component-runtime" }
kb-display = { path = "../../crates/display", optional = true }
kb-core = { path = "../../crates/keyboard-core" }
panic-halt = "1.0.0"

nrf-sdc = { version = "0.4.0", optional = true, default-features = false, features = ["nrf52840", "peripheral"] }
nrf-mpsl = { version = "0.4.0", optional = true, features = ["nrf52840", "critical-section-impl"] }
trouble-host = { version = "0.8.0", optional = true, default-features = false, features = ["derive", "gatt", "peripheral", "default-packet-pool", "default-packet-pool-mtu-128", "default-packet-pool-size-8", "security", "serde"] }
static_cell = { version = "2.1.1", optional = true }
postcard = { version = "1.1.3", default-features = false, optional = true }

[[bin]]
name = "xiao-led"
required-features = ["usb"]

[[bin]]
name = "paintbrush-usb"
required-features = ["usb"]

[[bin]]
name = "paintbrush-ble"
required-features = ["ble"]

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
debug = 2
panic = "abort"
