[package]
name = "kb-nrf52840"
version = "0.1.0"
edition = "2024"
build = "build.rs"

[workspace]

[features]
default = []
paintbrush-left = []

[dependencies]
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
embassy-executor = { version = "0.10.0", features = ["platform-cortex-m", "executor-thread"] }
embassy-futures = "0.1.2"
embassy-nrf = { version = "0.11.0", features = ["nrf52840", "time-driver-rtc1", "unstable-pac", "nfc-pins-as-gpio"] }
embassy-sync = "0.8.0"
embassy-time = "0.5.1"
embassy-usb = "0.6.0"
embedded-alloc = { version = "0.7.0", default-features = false, features = ["llff"] }
kb-component-runtime = { path = "../../crates/component-runtime" }
kb-core = { path = "../../crates/keyboard-core" }
panic-halt = "1.0.0"

[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
debug = 2
panic = "abort"
