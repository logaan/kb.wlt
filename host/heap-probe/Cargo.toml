[package]
name = "kb-heap-probe"
version = "0.1.0"
edition = "2024"
[workspace]
[dependencies]
kb-component-runtime = { path = "../runtime" }
kb-core = { path = "../../shared/keyboard-core" }
cortex-m = { version = "0.7.7", features = ["critical-section-single-core"] }
cortex-m-rt = "0.7.5"
cortex-m-semihosting = "0.5.0"
panic-semihosting = { version = "0.6.0", features = ["exit"] }
embedded-alloc = { version = "0.7.0", default-features = false, features = ["llff"] }
[profile.release]
codegen-units = 1
lto = "fat"
opt-level = "s"
panic = "abort"
