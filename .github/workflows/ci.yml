name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: thumbv7em-none-eabihf
          components: rustfmt
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: |
            . -> target
            resetter -> target
      - run: cargo fmt --all -- --check
      - run: cargo test --workspace --locked
      - run: cargo check --locked -p kb-core -p kb-component-runtime -p kb-display --target thumbv7em-none-eabihf
      - run: cargo test --locked --manifest-path resetter/Cargo.toml --target x86_64-unknown-linux-gnu
      - run: python3 -m unittest discover -s resetter/tests -p 'test_*.py'
      - run: python3 -m unittest discover -s scripts/tests -p 'test_*.py'
  firmware:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec
        with:
          targets: thumbv7em-none-eabihf
      - run: sudo apt-get update && sudo apt-get install -y clang libclang-dev qemu-system-arm
      - uses: Swatinem/rust-cache@d1527c8f67ef9af357290475d4af4b0fab8f12e0
        with:
          workspaces: |
            . -> target
            firmware/nrf52840 -> target
            firmware/heap-probe -> target
            resetter -> target
      - run: bash scripts/build-artifacts.sh
