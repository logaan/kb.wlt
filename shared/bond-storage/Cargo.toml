[package]
name = "kb-bond-storage"
version.workspace = true
edition.workspace = true
license = "MIT"

[dependencies]
serde = { version = "1", default-features = false, features = ["derive"] }
kb-core = { path = "../keyboard-core" }
postcard = { version = "1.1.3", default-features = false }
trouble-host = { version = "0.8.0", default-features = false, features = ["security", "serde", "peripheral", "gatt"] }
