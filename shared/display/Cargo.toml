[package]
name = "kb-display"
version.workspace = true
edition.workspace = true

[features]
lvgl = ["lvgl-tft", "lvgl-mip"]
lvgl-tft = []
lvgl-mip = []

[build-dependencies]
cc = "1"

[[test]]
name = "toucan-mip"
path = "../../toucan/tests/mip.rs"
required-features = ["lvgl"]

[dev-dependencies]
futures = { version = "0.3.31", default-features = false, features = ["executor"] }
